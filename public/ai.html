<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>ZANTA AI</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:Inter,system-ui,Arial}body{display:flex;justify-content:center}.app{width:min(920px,100%);min-height:100dvh;padding:12px;display:flex;flex-direction:column}.top{display:flex;align-items:center;gap:10px;padding:6px 0 12px;position:sticky;top:0;background:#000;z-index:5}.back{padding:10px 14px;border-radius:12px;background:#101010;border:1px solid #333;color:#fff;font-weight:900}.brand{flex:1}.brand b{display:block;font-size:18px}.brand small{color:#999}.verified{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:50%;background:#168bff;font-size:11px;font-weight:900;vertical-align:middle;box-shadow:0 0 12px #168bff77}.status{font-size:10px;color:#ff3f70}.chat{flex:1;display:flex;flex-direction:column;min-height:0}.messages{flex:1;overflow:auto;padding:8px 0 14px}.msg{max-width:86%;padding:12px 14px;border-radius:17px;margin:8px 0;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.msg.user{margin-left:auto;background:#2b0b15;border:1px solid #7e1d37}.msg.ai{background:#101010;border:1px solid #2c2c2c}.composer{display:flex;gap:8px;position:sticky;bottom:0;padding:10px 0;background:#000}.composer input{flex:1;min-width:0;background:#0b0b0b;color:#fff;border:1px solid #333;border-radius:14px;padding:13px;outline:none}.send{width:55px;border:0;border-radius:14px;background:linear-gradient(135deg,#ff174f,#9b1746);color:#fff;font-weight:900}.empty{text-align:center;color:#777;padding:35px 10px}.typing{color:#999;font-size:11px;padding:5px 4px}
</style></head><body><div class="app"><div class="top"><button class="back" onclick="history.back()">‹ BACK</button><div class="brand"><b>ZANTA AI <span class="verified">✓</span></b><small>@zanta000 · META VERIFIED AI</small></div><span class="status">● LIVE</span></div><div class="chat"><div id="messages" class="messages"><div class="empty">🤖 ZANTA AI<br><small>Ask anything. Sinhala, English and more.</small></div></div><div id="typing" class="typing" style="display:none">ZANTA AI is thinking…</div><form class="composer" onsubmit="send(event)"><input id="input" autocomplete="off" maxlength="4000" placeholder="Message ZANTA AI…"><button class="send" type="submit">➤</button></form></div></div><script>
const $=id=>document.getElementById(id);const historyMessages=[];
function add(role,text){const empty=document.querySelector('.empty');if(empty)empty.remove();const d=document.createElement('div');d.className='msg '+(role==='user'?'user':'ai');d.textContent=text;$('messages').appendChild(d);$('messages').scrollTop=$('messages').scrollHeight}
async function send(e){e.preventDefault();const input=$('input'),text=input.value.trim();if(!text)return;input.value='';add('user',text);historyMessages.push({role:'user',content:text});$('typing').style.display='block';try{const r=await fetch('/api/ai/chat',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:historyMessages})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'AI request failed.');add('assistant',d.message||'No response.');historyMessages.push({role:'assistant',content:d.message||''})}catch(err){add('assistant','⚠ '+err.message)}finally{$('typing').style.display='none';input.focus()}}
</script></body></html>
