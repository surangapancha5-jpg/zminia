<!DOCTYPE html>
<html lang="si">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ZANTA CHAT</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--bg:#0e0e12;--panel:#15151a;--panel2:#1b1b21;--line:#29292f;--text:#f7f7fa;--muted:#8f9099;--red:#e9004f;--green:#19d58a;--blue:#18a8ff}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans Sinhala",sans-serif}body{overflow:hidden}.app{height:100%;display:flex;flex-direction:column;max-width:900px;margin:auto;background:#0e0e12}.header{height:105px;background:#101014;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:18px 20px 12px}.brand{display:flex;align-items:center;gap:13px}.brandIcon{width:52px;height:52px;border-radius:15px;background:linear-gradient(145deg,#ff164f,#a70035);display:grid;place-items:center;font-size:26px;box-shadow:0 7px 22px #e9004f35}.brandTitle{font-size:23px;font-weight:900;letter-spacing:.5px}.brandSub{font-size:13px;color:var(--muted);margin-top:4px}.verified{color:#08aaf3;text-shadow:0 0 9px #08aaf3}.vip{display:inline-block;margin-left:6px;padding:4px 8px;border-radius:7px;background:#451025;color:#ff2c64;font-size:11px}.live{color:#00d99a}.headActions{display:flex;gap:20px;font-size:20px;color:#d9d9df}.tabs{height:70px;background:#101014;border-bottom:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr)}.tab{border:0;background:none;color:#858690;font-size:13px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;position:relative}.tab i{font-size:19px}.tab.active{color:#ff1d59}.tab.active:after{content:"";position:absolute;bottom:0;height:4px;width:72%;border-radius:4px 4px 0 0;background:#ff1d59}.main{flex:1;min-height:0;overflow:auto}.screen{display:none;min-height:100%}.screen.active{display:block}.list{padding:7px 0}.row{min-height:74px;padding:11px 17px;border-bottom:1px solid #1e1e23;display:flex;align-items:center;gap:12px;cursor:pointer}.row:hover{background:#15151a}.avatar{width:49px;height:49px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;background:linear-gradient(145deg,#ed164f,#5d0b2a);font-weight:900}.rowInfo{flex:1;min-width:0}.rowTitle{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rowSub{font-size:12px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rowAction{border:1px solid #d30a48;color:#ff3c70;background:#2a0d19;border-radius:18px;padding:8px 13px;font-weight:800;cursor:pointer;white-space:nowrap}.rowAction.accept{border-color:#18bb78;color:#36e69d;background:#09251b}.rowAction.pending{border-color:#555761;color:#aaa;background:#202025}.empty{padding:30px 18px;text-align:center;color:var(--muted)}.sectionHead{padding:15px 17px 8px;color:#a8a8b1;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.8px}.notice{margin:12px 15px;padding:12px;border:1px solid #402130;border-radius:14px;background:#1a1116}.notice b{display:block;margin-bottom:7px}.notice button{margin-top:8px;margin-right:6px}.compose{padding:14px 16px;border-bottom:1px solid var(--line);background:#111115}.composeTop{display:flex;gap:10px}.compose textarea{flex:1;background:#1c1c21;color:#fff;border:1px solid #28282f;border-radius:16px;padding:13px;resize:none;min-height:68px;outline:none}.composeActions{display:flex;gap:9px;margin-top:10px}.input{flex:1;background:#18181d;color:#fff;border:1px solid #2b2b31;border-radius:12px;padding:10px;outline:none}.btn{border:0;border-radius:13px;padding:10px 15px;background:var(--red);color:#fff;font-weight:800;cursor:pointer}.btn.secondary{background:#25252b}.feed{padding:16px}.post{background:#141419;border:1px solid #292930;border-radius:20px;overflow:hidden;margin-bottom:16px}.postHead{display:flex;align-items:center;gap:10px;padding:14px 15px}.postUser{font-weight:800}.postDate{font-size:12px;color:#85858d;margin-top:4px}.postText{padding:0 16px 14px;font-size:17px;line-height:1.5;white-space:pre-wrap}.postMedia{width:100%;max-height:520px;object-fit:cover;display:block}.postStats{display:flex;justify-content:space-between;padding:11px 16px;color:#888993;border-bottom:1px solid #24242a}.postActions{display:grid;grid-template-columns:repeat(2,1fr)}.postActions button{background:none;color:#c4c4cc;border:0;padding:13px;cursor:pointer;font-size:14px;font-weight:700}.postActions button:first-child{color:#ff2b61}.comments{border-top:1px solid #24242a;padding:10px 14px}.comment{padding:9px 0}.commentLine{display:flex;gap:8px}.commentBubble{background:#1d1d22;border-radius:15px;padding:9px 11px;flex:1}.commentName{font-weight:800;font-size:12px;margin-bottom:4px}.commentText{font-size:14px;line-height:1.4}.replyLink{border:0;background:none;color:#8f909a;padding:5px 0;font-size:12px;cursor:pointer}.replyList{margin-left:30px}.reply{padding:5px 0}.commentBox{display:flex;gap:7px;margin-top:7px}.commentBox input{flex:1}.chatWindow{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column}.chatWindow.open{display:flex}.chatHead{height:70px;background:#121216;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 14px}.chatHead .avatar{width:42px;height:42px}.chatHeadTitle{font-weight:800}.chatHeadStatus{font-size:12px;color:var(--green);margin-top:3px}.chatBody{flex:1;overflow:auto;padding:16px 12px;background:radial-gradient(circle at top,#18181d,#0e0e12 45%)}.bubbleWrap{display:flex;margin:7px 0}.bubbleWrap.mine{justify-content:flex-end}.bubble{max-width:78%;background:#202026;border-radius:17px 17px 17px 5px;padding:10px 12px;box-shadow:0 1px 2px #0005}.mine .bubble{background:#a6003a;border-radius:17px 17px 5px 17px}.bubbleTime{font-size:10px;color:#b9bac2;margin-top:5px;text-align:right}.replyQuote{border-left:3px solid #ff4a7c;padding-left:7px;margin-bottom:7px;color:#c7c7ce;font-size:11px}.chatFooter{display:flex;gap:8px;padding:10px 12px;background:#131318;border-top:1px solid var(--line)}.chatFooter input{flex:1;border:1px solid #303038;background:#202026;color:#fff;border-radius:22px;padding:12px 15px;outline:none}.send{width:44px;height:44px;border-radius:50%;border:0;background:var(--red);color:#fff}.groupCreate{margin:12px 15px;padding:13px;border:1px dashed #3a3a42;border-radius:14px;color:#c9c9d0;cursor:pointer}.modal{position:fixed;inset:0;background:#000b;z-index:100;display:none;align-items:flex-end}.modal.open{display:flex}.modalCard{width:100%;max-height:85%;overflow:auto;background:#15151a;border-radius:22px 22px 0 0;padding:17px}.modalTitle{font-size:18px;font-weight:900;margin-bottom:13px}.modalClose{float:right;background:none;border:0;color:#aaa;font-size:20px}.checkRow{display:flex;align-items:center;gap:9px;padding:10px;border-bottom:1px solid #24242a}.checkRow input{accent-color:var(--red)}.search{padding:12px 15px}.search input{width:100%;padding:12px;border-radius:18px;border:1px solid #2c2c33;background:#18181d;color:#fff;outline:none}.status{padding:10px 16px;color:#999;font-size:12px}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#27272d;color:#fff;padding:11px 15px;border-radius:14px;z-index:300;display:none;max-width:90%}@media(min-width:700px){body{background:#08080b}.app{box-shadow:0 0 50px #000}.modal{align-items:center}.modalCard{max-width:560px;border-radius:22px}.chatWindow{left:50%;transform:translateX(-50%);width:min(900px,100%)}}
.tabBadge{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;margin-left:4px;border-radius:10px;background:#e9004f;color:#fff;font-size:10px;font-weight:900}.avatar img,.chatHead .avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}.msgAuthor{display:flex;align-items:center;gap:7px;margin-bottom:5px;font-size:11px;font-weight:800;color:#d8d8df}.msgAuthor img,.msgAuthor .miniAvatar{width:25px;height:25px;border-radius:50%;object-fit:cover;background:#4b1029;display:grid;place-items:center}.msgBubbleDeleted{font-style:italic;color:#aaa}.voiceMsg{display:flex;align-items:center;gap:9px;min-width:190px}.voiceMsg audio{width:170px;height:34px}.voiceDuration{font-size:10px;color:#bbb}.statusTick{font-size:12px;margin-left:4px}.statusTick.delivered{color:#eee}.statusTick.read{color:#18a8ff}.replyBar{display:flex;align-items:center;gap:8px;padding:7px 12px;background:#190a11;border-top:1px solid #8d123d;color:#ddd;font-size:12px}.replyBar span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.replyBar button{border:0;background:#330b1b;color:#fff;border-radius:8px;width:28px;height:28px}.mic{width:44px;height:44px;border-radius:50%;border:1px solid #7b1740;background:#210914;color:#ff3b70}.mic.recording{background:#e9004f;animation:recPulse 1s infinite}.actionModal{position:fixed;inset:0;background:#000b;z-index:250;display:none;align-items:flex-end;justify-content:center}.actionModal.open{display:flex}.actionCard{width:min(520px,100%);background:#050507;border:1px solid #3a0a1d;border-top:3px solid #e9004f;border-radius:22px 22px 0 0;padding:14px;box-shadow:0 -12px 45px #e9004f33}.actionPreview{padding:10px 12px;margin-bottom:8px;border-radius:12px;background:#120b0f;color:#ccc;font-size:12px;max-height:80px;overflow:hidden}.actionCard button{width:100%;padding:14px;margin-top:7px;border:1px solid #3c101f;border-radius:12px;background:#130b0f;color:#fff;font-weight:800}.actionCard button.danger{background:#3b0719;color:#ff4778;border-color:#a30b40}.actionCard button.cancel{background:#202026;color:#bbb;border-color:#303038}@keyframes recPulse{50%{box-shadow:0 0 0 8px #e9004f22}}@media(min-width:700px){.actionModal{align-items:center}.actionCard{border-radius:22px;border-top:3px solid #e9004f}}</style>
</head>
<body>
<div class="app">
  <header class="header"><div class="brand"><div class="brandIcon"><i class="fa-regular fa-comment-dots"></i></div><div><div class="brandTitle">ZANTA CHAT <span class="vip">VIP</span></div><div class="brandSub" id="myIdentity">Loading…</div></div></div><div class="headActions"><i class="fa-solid fa-magnifying-glass" onclick="openSearch()"></i><i class="fa-solid fa-arrow-left" onclick="location.href='/'"></i></div></header>
  <nav class="tabs"><button class="tab active" data-tab="chats" onclick="switchTab('chats')"><i class="fa-regular fa-comment-dots"></i><span>Chats <b id="chatTabBadge" class="tabBadge"></b></span></button><button class="tab" data-tab="groups" onclick="switchTab('groups')"><i class="fa-solid fa-user-group"></i><span>Groups <b id="groupTabBadge" class="tabBadge"></b></span></button><button class="tab" data-tab="feed" onclick="switchTab('feed')"><i class="fa-solid fa-compass"></i><span>Feed</span></button><button class="tab" data-tab="users" onclick="switchTab('users')"><i class="fa-solid fa-users"></i><span>Users</span></button></nav>
  <main class="main">
    <section id="chats" class="screen active"><div id="inviteArea"></div><div class="sectionHead">Chats</div><div id="chatList" class="list"></div></section>
    <section id="groups" class="screen"><div class="groupCreate" onclick="openGroupModal()"><i class="fa-solid fa-plus"></i> New Group Create කරන්න</div><div class="sectionHead">My Groups</div><div id="groupList" class="list"></div></section>
    <section id="feed" class="screen"><div class="compose"><div class="composeTop"><div class="avatar"><i class="fa-solid fa-user"></i></div><textarea id="postText" placeholder="ඔබ සිතන්නේ කුමක්ද? What's on your mind?" maxlength="5000"></textarea></div><div class="composeActions"><input class="input" id="mediaUrl" placeholder="Photo / Video URL (optional)"><select class="input" id="mediaType" style="max-width:110px"><option value="">Media</option><option value="image">Photo</option><option value="video">Video</option></select><button class="btn" onclick="createPost()">Post කරන්න</button></div></div><div class="feed" id="feedContainer"><div class="empty">Loading feed…</div></div></section>
    <section id="users" class="screen"><div class="search"><input id="userSearch" placeholder="Search users…" oninput="renderUsers()"></div><div id="usersContainer" class="list"><div class="empty">Loading users…</div></div></section>
  </main>
</div>

<div id="chatWindow" class="chatWindow"><div class="chatHead"><i class="fa-solid fa-arrow-left" onclick="closeChat()"></i><div class="avatar" id="chatAvatar"><i class="fa-solid fa-user"></i></div><div style="flex:1"><div id="chatTitle" class="chatHeadTitle">Chat</div><div id="chatStatus" class="chatHeadStatus">Online</div></div><i class="fa-solid fa-circle-info" onclick="showChatInfo()"></i></div><div id="chatBody" class="chatBody"></div><div id="replyBar" class="replyBar" style="display:none"><span id="replyBarText"></span><button onclick="cancelReply()">×</button></div><div class="chatFooter"><button id="micButton" class="mic" onclick="toggleRecording()"><i class="fa-solid fa-microphone"></i></button><input id="messageInput" placeholder="Type a message…" onkeydown="if(event.key==='Enter'){event.preventDefault();sendChat()}"><button class="send" onclick="sendChat()"><i class="fa-solid fa-paper-plane"></i></button></div></div>

<div id="groupModal" class="modal"><div class="modalCard"><button class="modalClose" onclick="closeGroupModal()">×</button><div class="modalTitle">Create New Group</div><input class="input" style="width:100%;margin-bottom:10px" id="groupName" placeholder="Group name" maxlength="60"><div id="friendChecks"></div><button class="btn" style="width:100%;margin-top:12px" onclick="createGroup()">Create Group</button></div></div>
<div id="messageActionModal" class="actionModal"><div class="actionCard"><div id="actionPreview" class="actionPreview"></div><button onclick="replyFromAction()"><i class="fa-solid fa-reply"></i> Reply</button><button id="deleteActionBtn" class="danger" onclick="deleteFromAction()"><i class="fa-solid fa-trash"></i> Delete</button><button class="cancel" onclick="closeMessageActions()">Cancel</button></div></div>
<div id="searchModal" class="modal"><div class="modalCard"><button class="modalClose" onclick="closeSearch()">×</button><div class="modalTitle">Search</div><input class="input" style="width:100%" id="globalSearch" placeholder="Search users, chats, groups…" oninput="globalSearch()"><div id="searchResults"></div></div></div>
<div id="toast" class="toast"></div>

<script>
let me=null,activeChat=null,pollTimer=null,presenceTimer=null,refreshTimer=null,users=[],friends=[],groups=[],unread={private:{},groups:{},supportOwnerId:null},replyTarget=null,actionMessage=null,mediaRecorder=null,recordChunks=[],recordStartedAt=0;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const time=s=>{const d=new Date(s);return isNaN(d)?'':d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});};
const dateTime=s=>{const d=new Date(s);return isNaN(d)?'':d.toLocaleString([], {year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});};
const unreadMark=n=>{n=Number(n)||0;if(n<=0)return '';if(n===1)return '❶';if(n===2)return '❷';if(n===3)return '❸';return n>99?'99+':String(n)};
function avatarHtml(src,name,cls='avatar'){return src?`<div class="${cls}"><img src="${esc(src)}" alt="DP"></div>`:`<div class="${cls}">${esc((name||'U').replace('@','').charAt(0).toUpperCase()||'U')}</div>`}
function toast(s){const t=$('toast');t.textContent=s;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2600)}
async function api(url,opt={}){const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Request failed');return d}
async function boot(){try{const d=await api('/api/auth/me');if(!d.authenticated){location.href='/';return}me=d.user;$('myIdentity').innerHTML=esc(me.username||'User')+' <span class="verified">●</span> <span class="live">• Live</span>';await Promise.all([loadUnread(),loadChats(),loadUsers(),loadGroups(),loadFeed(),loadInvites()]);presenceTimer=setInterval(()=>api('/api/presence/heartbeat').catch(()=>{}),15000);refreshTimer=setInterval(async()=>{await loadUnread();await loadInvites();await loadChats();await loadGroups();if(activeChat)pollChat(true)},1000)}catch(e){toast(e.message)}}
function switchTab(tab){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===tab));if(tab==='chats'){loadUnread();loadChats();loadInvites()}if(tab==='groups'){loadUnread();loadGroups()}if(tab==='feed')loadFeed();if(tab==='users')loadUsers()}
async function loadUnread(){try{unread=await api('/api/chat/unread');$('chatTabBadge').textContent=unreadMark(Object.values(unread.private||{}).reduce((a,b)=>a+b,0));$('groupTabBadge').textContent=unreadMark(Object.values(unread.groups||{}).reduce((a,b)=>a+b,0))}catch(e){}}
async function loadInvites(){try{const d=await api('/api/dashboard');const pending=(d.notices||[]).filter(n=>n.kind==='friend_invite'&&!n.read);$('inviteArea').innerHTML=pending.length?pending.map(n=>`<div class="notice"><b>💌 ${esc(n.message)}</b><button class="btn" onclick="respondInvite('${esc(n.data?.inviteId||'')}','accept')">Accept</button><button class="btn secondary" onclick="respondInvite('${esc(n.data?.inviteId||'')}','reject')">Reject</button></div>`).join(''):''}catch(e){}}
async function respondInvite(id,action){try{await api('/api/invites/'+encodeURIComponent(id)+'/respond',{method:'POST',body:JSON.stringify({action})});toast(action==='accept'?'Invitation accepted. Chat added!':'Invitation rejected.');await Promise.all([loadInvites(),loadChats(),loadUsers(),loadUnread()])}catch(e){toast(e.message)}}
async function loadChats(){try{const d=await api('/api/friends');friends=d.friends||[];const box=$('chatList');let html=`<div class="row" onclick="openSupportChat()">${avatarHtml('','Zanta Support')}<div class="rowInfo"><div class="rowTitle">Zanta Support <span class="verified">●</span></div><div class="rowSub">Official Support · zantaxmd2@gmail.com</div></div>${unreadMark(unread.private?.[unread.supportOwnerId])?`<span class="tabBadge">${unreadMark(unread.private?.[unread.supportOwnerId])}</span>`:'<span style="color:#18d98b;font-size:12px">LIVE</span>'}</div>`;html+=friends.map(f=>`<div class="row" onclick="openPrivate('${f.id}','${esc(f.username)}')">${avatarHtml(f.avatar,f.username)}<div class="rowInfo"><div class="rowTitle">${esc(f.username)}</div><div class="rowSub">${f.isOnline?'Online':'Offline · Last seen '+(f.lastSeen?dateTime(f.lastSeen):'unknown')}</div></div>${unreadMark(unread.private?.[f.id])?`<span class="tabBadge">${unreadMark(unread.private?.[f.id])}</span>`:`<span style="color:${f.isOnline?'#18d98b':'#777'}">●</span>`}</div>`).join('');box.innerHTML=html}catch(e){$('chatList').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
async function loadUsers(){try{const d=await api('/api/users');users=d.users||[];renderUsers()}catch(e){$('usersContainer').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function renderUsers(){const q=String($('userSearch')?.value||'').toLowerCase();const list=users.filter(u=>(u.username||'').toLowerCase().includes(q));$('usersContainer').innerHTML=list.length?list.map(u=>{const r=u.relation;let label='Invite',cls='',action=`sendInvite('${u.id}')`;if(r?.status==='accepted'){label='Chat';action=`openPrivate('${u.id}','${esc(u.username)}')`}else if(r?.status==='pending'){label=r.outgoing?'Sent':'Accept';cls=r.outgoing?'pending':'accept';action=r.outgoing?'void(0)':`respondInvite('${r.inviteId}','accept')`}return `<div class="row">${avatarHtml(u.avatar,u.username)}<div class="rowInfo"><div class="rowTitle">${esc(u.username)}</div><div class="rowSub">${u.isOnline?'Online':'Offline · Last seen '+(u.lastSeen?dateTime(u.lastSeen):'unknown')}</div></div><button class="rowAction ${cls}" onclick="event.stopPropagation();${action}">${label}</button></div>`}).join(''):'<div class="empty">No users found.</div>'}
async function sendInvite(userId){try{await api('/api/invites',{method:'POST',body:JSON.stringify({userId})});toast('Invite sent.');await loadUsers()}catch(e){toast(e.message)}}
async function loadGroups(){try{const d=await api('/api/groups');groups=d.groups||[];$('groupList').innerHTML=groups.length?groups.map(g=>`<div class="row" onclick="openGroup('${g.id}','${esc(g.name)}')">${avatarHtml(g.avatar,g.name)}<div class="rowInfo"><div class="rowTitle">${esc(g.name)} ${g.name==='Zanta Support Team'?'<span class="verified">●</span>':''}</div><div class="rowSub">${g.members} members · Owner ${esc(g.ownerName)}</div></div>${unreadMark(unread.groups?.[g.id])?`<span class="tabBadge">${unreadMark(unread.groups?.[g.id])}</span>`:''}</div>`).join(''):'<div class="empty">No groups yet.</div>'}catch(e){$('groupList').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
async function openGroupModal(){await loadUsers();const accepted=users.filter(u=>u.relation?.status==='accepted');$('friendChecks').innerHTML=accepted.length?accepted.map(u=>`<label class="checkRow"><input type="checkbox" value="${u.id}"> ${esc(u.username)}</label>`).join(''):'<div class="empty">First accept some user invitations to add friends to a group.</div>';$('groupName').value='';$('groupModal').classList.add('open')}
function closeGroupModal(){$('groupModal').classList.remove('open')}
async function createGroup(){const name=$('groupName').value.trim();const ids=[...document.querySelectorAll('#friendChecks input:checked')].map(x=>x.value);if(!name)return toast('Group name required.');try{const d=await api('/api/groups',{method:'POST',body:JSON.stringify({name,memberIds:ids})});closeGroupModal();toast('Group created.');await loadGroups();openGroup(d.id,name)}catch(e){toast(e.message)}}
async function openPrivate(id,name){activeChat={type:'private',id,name};replyTarget=null;setReplyBar();showChat(name,'Loading…');await pollChat(false);startPolling()}
async function openSupportChat(){try{const d=await api('/api/support/chat');activeChat={type:'support',id:d.owner.id,name:'Zanta Support',avatar:d.owner.avatar};replyTarget=null;setReplyBar();showChat('Zanta Support',statusText(d.owner));setChatAvatar(d.owner.avatar,'Zanta Support');renderMessages(d.messages,d.owner);startPolling();await loadUnread()}catch(e){toast(e.message)}}
async function openGroup(id,name){activeChat={type:'group',id,name};replyTarget=null;setReplyBar();showChat(name,'Group');await pollChat(false);startPolling()}
function statusText(peer){return peer?.isOnline?'Online':('Offline · Last seen '+(peer?.lastSeen?dateTime(peer.lastSeen):'unknown'))}
function showChat(name,status){$('chatTitle').textContent=name;$('chatStatus').textContent=status;$('chatWindow').classList.add('open');$('messageInput').focus()}
function setChatAvatar(src,name){$('chatAvatar').innerHTML=src?`<img src="${esc(src)}" alt="DP">`:esc((name||'U').replace('@','').charAt(0).toUpperCase()||'U')}
function closeChat(){activeChat=null;replyTarget=null;setReplyBar();clearInterval(pollTimer);pollTimer=null;$('chatWindow').classList.remove('open');loadUnread()}
function startPolling(){clearInterval(pollTimer);pollTimer=setInterval(()=>pollChat(true),900)}
async function pollChat(silent){if(!activeChat)return;try{let d;if(activeChat.type==='support')d=await api('/api/support/chat');else if(activeChat.type==='private')d=await api('/api/chat/'+activeChat.id);else d=await api('/api/groups/'+activeChat.id+'/messages');if(activeChat.type==='group'){setChatAvatar(d.avatar,activeChat.name);renderMessages(d.messages,{isOnline:true});}else{setChatAvatar(d.peer?.avatar||d.owner?.avatar,d.peer?.username||d.owner?.username||activeChat.name);renderMessages(d.messages,d.peer||d.owner)}if(!silent)$('chatBody').scrollTop=$('chatBody').scrollHeight;loadUnread()}catch(e){if(!silent)toast(e.message)}}
function tickHtml(m){if(String(m.from)!==String(me.id))return '';if(m.readAt)return '<span class="statusTick read">✓✓</span>';if(m.deliveredAt)return '<span class="statusTick delivered">✓✓</span>';return '<span class="statusTick">✓</span>'}
function messageContent(m){if(m.deleted)return '<div class="msgBubbleDeleted">This message was deleted</div>';if(m.kind==='voice'&&m.audioUrl)return `<div class="voiceMsg"><i class="fa-solid fa-microphone"></i><audio controls preload="metadata" onclick="event.stopPropagation()" src="${esc(m.audioUrl)}"></audio><span class="voiceDuration">${Math.round(m.audioDuration||0)}s</span></div>`;return `<div>${esc(m.text||'')}</div>`}
function renderMessages(messages,peer){const box=$('chatBody');const nearBottom=box.scrollHeight-box.scrollTop-box.clientHeight<120;box.innerHTML=(messages||[]).map(m=>{const mine=String(m.from)===String(me.id);const q=m.replyTo?`<div class="replyQuote">↪ ${esc(m.replyTo.username||'User')}: ${esc(m.replyTo.text||'Voice message')}</div>`:'';const author=activeChat.type==='group'?`<div class="msgAuthor">${avatarHtml(m.avatar,m.username,'miniAvatar')}<span>${esc(m.username||'User')}</span></div>`:'';const encoded=encodeURIComponent(JSON.stringify(m));return `<div class="bubbleWrap ${mine?'mine':''}" onclick="openMessageActions(JSON.parse(decodeURIComponent('${encoded}')))"><div class="bubble">${author}${q}${messageContent(m)}<div class="bubbleTime">${time(m.createdAt)} ${tickHtml(m)}</div></div></div>`}).join('')||'<div class="empty">Start the conversation…</div>';if(nearBottom)box.scrollTop=box.scrollHeight;$('chatStatus').textContent=activeChat.type==='group'?'Group':statusText(peer)}
function setReplyBar(){if(!replyTarget){$('replyBar').style.display='none';$('replyBarText').textContent='';return}$('replyBar').style.display='flex';$('replyBarText').textContent='Replying to '+(replyTarget.username||'User')+': '+(replyTarget.text||'Voice message')}
function cancelReply(){replyTarget=null;setReplyBar()}
function openMessageActions(m){actionMessage=m;$('actionPreview').textContent=(m.username||'You')+': '+(m.text||'Voice message');$('deleteActionBtn').style.display=String(m.from)===String(me.id)&&!m.deleted?'block':'none';$('messageActionModal').classList.add('open')}
function closeMessageActions(){actionMessage=null;$('messageActionModal').classList.remove('open')}
function replyFromAction(){if(!actionMessage)return;replyTarget=actionMessage;setReplyBar();closeMessageActions();$('messageInput').focus()}
async function deleteFromAction(){if(!actionMessage||String(actionMessage.from)!==String(me.id))return;try{if(activeChat.type==='group')await api('/api/groups/'+activeChat.id+'/messages/'+actionMessage.id,{method:'DELETE'});else if(activeChat.type==='support')await api('/api/support/chat/'+actionMessage.id,{method:'DELETE'});else await api('/api/chat/'+activeChat.id+'/'+actionMessage.id,{method:'DELETE'});closeMessageActions();await pollChat(false)}catch(e){toast(e.message)}}
async function sendChat(){const input=$('messageInput'),text=input.value.trim();if(!text||!activeChat)return;input.value='';const replyId=replyTarget?.id||null;try{const body={text,kind:'text',replyTo:replyId};if(activeChat.type==='support')await api('/api/support/chat',{method:'POST',body:JSON.stringify(body)});else if(activeChat.type==='private')await api('/api/chat/'+activeChat.id,{method:'POST',body:JSON.stringify(body)});else await api('/api/groups/'+activeChat.id+'/messages',{method:'POST',body:JSON.stringify(body)});replyTarget=null;setReplyBar();await pollChat(false)}catch(e){input.value=text;toast(e.message)}}
async function toggleRecording(){if(mediaRecorder&&mediaRecorder.state==='recording'){mediaRecorder.stop();return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});const mime=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'].find(x=>MediaRecorder.isTypeSupported(x))||'';mediaRecorder=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);recordChunks=[];recordStartedAt=Date.now();$('micButton').classList.add('recording');$('micButton').innerHTML='<i class="fa-solid fa-stop"></i>';mediaRecorder.ondataavailable=e=>{if(e.data.size)recordChunks.push(e.data)};mediaRecorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());$('micButton').classList.remove('recording');$('micButton').innerHTML='<i class="fa-solid fa-microphone"></i>';const blob=new Blob(recordChunks,{type:mediaRecorder.mimeType||'audio/webm'});const duration=Math.min(120,(Date.now()-recordStartedAt)/1000);if(blob.size>4800000){toast('Voice message is too large. Keep it under about 2 minutes.');return}const reader=new FileReader();reader.onload=async()=>{try{const body={kind:'voice',audioUrl:reader.result,audioDuration:Math.round(duration),replyTo:replyTarget?.id||null};if(activeChat.type==='support')await api('/api/support/chat',{method:'POST',body:JSON.stringify(body)});else if(activeChat.type==='private')await api('/api/chat/'+activeChat.id,{method:'POST',body:JSON.stringify(body)});else await api('/api/groups/'+activeChat.id+'/messages',{method:'POST',body:JSON.stringify(body)});replyTarget=null;setReplyBar();await pollChat(false)}catch(e){toast(e.message)}};reader.readAsDataURL(blob)};mediaRecorder.start();toast('Recording… tap mic again to send');setTimeout(()=>{if(mediaRecorder?.state==='recording')mediaRecorder.stop()},120000)}catch(e){toast('Microphone permission is required.')}}
async function loadFeed(){try{const d=await api('/api/feed');$('feedContainer').innerHTML=(d.posts||[]).map(renderPost).join('')||'<div class="empty">No posts yet.</div>'}catch(e){$('feedContainer').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function renderPost(p){const media=p.mediaUrl?(p.mediaType==='video'?`<video class="postMedia" controls src="${esc(p.mediaUrl)}"></video>`:`<img class="postMedia" src="${esc(p.mediaUrl)}" alt="Post media">`):'';return `<article class="post"><div class="postHead"><div class="avatar"><i class="fa-solid fa-user"></i></div><div><div class="postUser">${esc(p.author.username)} ${p.author.verified?'<span class="verified">●</span>':''}</div><div class="postDate">${new Date(p.createdAt).toLocaleString()}</div></div></div><div class="postText">${esc(p.text)}</div>${media}<div class="postStats"><span>❤️ ${p.likes} Likes</span><span>${p.comments.length} Comments</span></div><div class="postActions"><button onclick="toggleLike('${p.id}')">❤️ ${p.liked?'Liked':'Like'}</button><button onclick="focusComment('${p.id}')">💬 Comment</button></div><div class="comments">${p.comments.map(c=>renderComment(p.id,c)).join('')}<div class="commentBox"><input class="input" id="comment-${p.id}" placeholder="Write a comment…"><button class="btn" onclick="addComment('${p.id}')">Send</button></div></div></article>`}
function renderComment(postId,c){return `<div class="comment"><div class="commentLine"><div class="commentBubble"><div class="commentName">${esc(c.username)} ${c.verified?'<span class="verified">●</span>':''}</div><div class="commentText">${esc(c.text)}</div></div></div><button class="replyLink" onclick="focusReply('${postId}','${c.id}')">↩ Reply</button><div class="replyList">${(c.replies||[]).map(r=>`<div class="reply"><div class="commentBubble"><div class="commentName">${esc(r.username)} ${r.verified?'<span class="verified">●</span>':''}</div><div class="commentText">${esc(r.text)}</div></div></div>`).join('')}<div id="replybox-${c.id}"></div></div></div>`}
async function createPost(){const text=$('postText').value.trim(),mediaUrl=$('mediaUrl').value.trim(),mediaType=$('mediaType').value;if(!text&&!mediaUrl)return toast('Write something or add media.');try{await api('/api/feed',{method:'POST',body:JSON.stringify({text,mediaUrl,mediaType})});$('postText').value='';$('mediaUrl').value='';await loadFeed();toast('Post published.')}catch(e){toast(e.message)}}
async function toggleLike(id){try{await api('/api/feed/'+id+'/like',{method:'POST'});await loadFeed()}catch(e){toast(e.message)}}
async function addComment(id){const input=$('comment-'+id),text=input.value.trim();if(!text)return;try{await api('/api/feed/'+id+'/comments',{method:'POST',body:JSON.stringify({text})});input.value='';await loadFeed()}catch(e){toast(e.message)}}
function focusComment(id){const x=$('comment-'+id);x?.focus()}
function focusReply(postId,commentId){const box=$('replybox-'+commentId);if(!box)return;box.innerHTML=`<div class="commentBox"><input class="input" id="reply-${commentId}" placeholder="Reply…"><button class="btn" onclick="addReply('${postId}','${commentId}')">Reply</button></div>`;$('reply-'+commentId).focus()}
async function addReply(postId,commentId){const input=$('reply-'+commentId),text=input?.value.trim();if(!text)return;try{await api('/api/feed/'+postId+'/comments/'+commentId+'/replies',{method:'POST',body:JSON.stringify({text})});await loadFeed()}catch(e){toast(e.message)}}
function openSearch(){$('searchModal').classList.add('open');$('globalSearch').focus();globalSearch()}
function closeSearch(){$('searchModal').classList.remove('open')}
function globalSearch(){const q=String($('globalSearch').value||'').toLowerCase().trim();if(!q){$('searchResults').innerHTML='<div class="empty">Type to search…</div>';return}const us=users.filter(u=>(u.username||'').toLowerCase().includes(q));const gs=groups.filter(g=>(g.name||'').toLowerCase().includes(q));$('searchResults').innerHTML=[...us.map(u=>`<div class="row" onclick="closeSearch();${u.relation?.status==='accepted'?`openPrivate('${u.id}','${esc(u.username)}')`:`sendInvite('${u.id}')`}">${avatarHtml(u.avatar,u.username)}<div class="rowInfo"><div class="rowTitle">${esc(u.username)}</div><div class="rowSub">User</div></div><span class="rowAction">${u.relation?.status==='accepted'?'Chat':'Invite'}</span></div>`),...gs.map(g=>`<div class="row" onclick="closeSearch();openGroup('${g.id}','${esc(g.name)}')">${avatarHtml(g.avatar,g.name)}<div class="rowInfo"><div class="rowTitle">${esc(g.name)}</div><div class="rowSub">Group · ${g.members} members</div></div></div>`)].join('')||'<div class="empty">No matches.</div>'}

boot();
</script>
</body>
</html>
