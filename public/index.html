<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zanta Official Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
        html,body{min-height:100%;background:#05000a}
        body{display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:10px;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;overflow-x:auto}
        /* Locked dashboard display: the same layout is used on phone and desktop. */
        .app-frame{position:relative;width:100%;max-width:480px;background:#0d0118;border-radius:20px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.8);flex:0 0 480px}
        .ui-wrapper{position:relative;width:100%;line-height:0}
        .ui-wrapper img{width:100%;height:auto;display:block;pointer-events:none;user-select:none}
        .laser-box{position:absolute;pointer-events:none;z-index:5;overflow:hidden}
        .laser-box span{position:absolute;display:block}
        .laser-box span:nth-child(1){top:0;left:-100%;width:100%;height:2px;animation:moveRight 2s linear infinite}
        .laser-box span:nth-child(2){top:-100%;right:0;width:2px;height:100%;animation:moveDown 2s linear infinite .5s}
        .laser-box span:nth-child(3){bottom:0;right:-100%;width:100%;height:2px;animation:moveLeft 2s linear infinite 1s}
        .laser-box span:nth-child(4){bottom:-100%;left:0;width:2px;height:100%;animation:moveUp 2s linear infinite 1.5s}
        @keyframes moveRight{0%{left:-100%}100%{left:100%}}
        @keyframes moveDown{0%{top:-100%}100%{top:100%}}
        @keyframes moveLeft{0%{right:-100%}100%{right:100%}}
        @keyframes moveUp{0%{bottom:-100%}100%{bottom:100%}}
        .sidebar-laser{top:10.5%;left:1.2%;width:18.5%;height:68%;border-radius:12px}
        .sidebar-laser span:nth-child(1),.sidebar-laser span:nth-child(3){background:linear-gradient(90deg,transparent,#00d9ff,transparent)}
        .sidebar-laser span:nth-child(2),.sidebar-laser span:nth-child(4){background:linear-gradient(180deg,transparent,#00d9ff,transparent)}
        .banner-laser{top:10.5%;left:21%;width:77%;height:20.2%;border-radius:14px}
        .banner-laser span:nth-child(1),.banner-laser span:nth-child(3){background:linear-gradient(90deg,transparent,#ff00ea,transparent)}
        .banner-laser span:nth-child(2),.banner-laser span:nth-child(4){background:linear-gradient(180deg,transparent,#ff00ea,transparent)}
        .bot-card-laser{top:32%;left:21%;width:77%;height:11.8%;border-radius:14px}
        .bot-card-laser span:nth-child(1),.bot-card-laser span:nth-child(3){background:linear-gradient(90deg,transparent,#00f0ff,transparent)}
        .bot-card-laser span:nth-child(2),.bot-card-laser span:nth-child(4){background:linear-gradient(180deg,transparent,#00f0ff,transparent)}
        .shop-card-laser{top:45%;left:21%;width:77%;height:12.5%;border-radius:14px}
        .shop-card-laser span:nth-child(1),.shop-card-laser span:nth-child(3){background:linear-gradient(90deg,transparent,#00ff66,transparent)}
        .shop-card-laser span:nth-child(2),.shop-card-laser span:nth-child(4){background:linear-gradient(180deg,transparent,#00ff66,transparent)}
        .games-card-laser{top:58.8%;left:21%;width:77%;height:12.5%;border-radius:14px}
        .games-card-laser span:nth-child(1),.games-card-laser span:nth-child(3){background:linear-gradient(90deg,transparent,#ff5500,transparent)}
        .games-card-laser span:nth-child(2),.games-card-laser span:nth-child(4){background:linear-gradient(180deg,transparent,#ff5500,transparent)}
        .shoshal-card-laser{top:72.8%;left:21%;width:77%;height:12.5%;border-radius:14px}
        .shoshal-card-laser span:nth-child(1),.shoshal-card-laser span:nth-child(3){background:linear-gradient(90deg,transparent,#bc00ff,transparent)}
        .shoshal-card-laser span:nth-child(2),.shoshal-card-laser span:nth-child(4){background:linear-gradient(180deg,transparent,#bc00ff,transparent)}
        .hotspot{position:absolute;display:flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer;background:rgba(255,255,255,0);border:0;z-index:10}
        .hotspot:hover,.hotspot:focus,.hotspot:active{background:rgba(255,255,255,0);transform:none;box-shadow:none}
        .text-label{font-family:'Orbitron',Arial,sans-serif;font-weight:800;font-size:13px;letter-spacing:1px;text-transform:uppercase;pointer-events:none;width:100%;text-align:center;line-height:1}
        .label-coins{color:#FFE600;text-shadow:0 0 4px rgba(255,230,0,.8),0 0 10px rgba(255,180,0,.6)}
        .label-gems{color:#FF66FF;text-shadow:0 0 4px rgba(255,102,255,.8),0 0 10px rgba(220,38,255,.6)}
        .btn-coins{top:2.8%;left:36.5%;width:18.5%;height:3.2%;border-radius:20px}
        .btn-gems{top:2.8%;left:56.5%;width:18.5%;height:3.2%;border-radius:20px}
        .btn-notif{top:2.5%;left:81%;width:7.5%;height:3.8%;border-radius:50%}
        .btn-profile{top:2.5%;left:89.2%;width:8.5%;height:3.8%;border-radius:50%}
        .btn-home{top:11.8%;left:2.2%;width:16.5%;height:4.4%}
        .btn-shop{top:18.8%;left:2.2%;width:16.5%;height:4.4%}
        .btn-bot{top:23.9%;left:2.2%;width:16.5%;height:4.4%}
        .btn-games{top:29%;left:2.2%;width:16.5%;height:4.4%}
        .btn-rewards{top:34%;left:2.2%;width:16.5%;height:4.4%}
        .btn-support{top:39%;left:2.2%;width:16.5%;height:4.4%}
        .btn-channel-react{top:44%;left:2.2%;width:16.5%;height:4.4%}
        .btn-channel-follow{top:49%;left:2.2%;width:16.5%;height:4.4%}
        .btn-chat-group{top:54%;left:2.2%;width:16.5%;height:4.4%}
        .btn-inbox{top:59%;left:2.2%;width:16.5%;height:4.4%}
        .btn-feed{top:63.8%;left:2.2%;width:16.5%;height:4.4%}

        .btn-about{top:73.5%;left:2.2%;width:16.5%;height:4.4%}
        .btn-bot-pair-go{top:38.8%;left:38%;width:17.5%;height:3.4%;border-radius:20px}
        .btn-connect-go{top:38.8%;left:77.5%;width:16.5%;height:3.4%;border-radius:20px}
        .btn-shop-go{top:52.6%;left:39.5%;width:21.5%;height:3.6%;border-radius:20px}
        .btn-games-go{top:66.8%;left:39.5%;width:21.5%;height:3.6%;border-radius:20px}
        .btn-shoshal-go{top:80.8%;left:39.5%;width:21.5%;height:3.6%;border-radius:20px}
        .btn-whatsapp-1{top:93%;left:68.2%;width:7.5%;height:3.8%;border-radius:50%}

        .btn-email{top:93%;left:87%;width:7.5%;height:3.8%;border-radius:50%}
    </style>
</head>
