<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZANTA-XMD - Bot Pairing</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;850&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background-color:#050002;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'Rajdhani',sans-serif;background-image:radial-gradient(circle at 50% 0%,rgba(239,68,68,.25),transparent 70%),radial-gradient(circle at 50% 100%,rgba(153,27,27,.2),transparent 70%);padding:15px;overflow:hidden}
        #loader-screen{position:fixed;top:0;left:0;width:100vw;height:100vh;background:#030001;z-index:99999;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:20px;animation:fadeOutLoader .5s ease 4.8s forwards}
        .loader-spinner{width:80px;height:80px;border:5px solid rgba(239,68,68,.2);border-top:5px solid #ef4444;border-radius:50%;animation:spin 1s linear infinite;box-shadow:0 0 25px rgba(239,68,68,.6)}
        .loader-text{font-family:'Orbitron',sans-serif;color:#ef4444;font-size:20px;font-weight:850;letter-spacing:2px;text-shadow:0 0 10px rgba(239,68,68,.8)}
        @keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
        @keyframes fadeOutLoader{0%{opacity:1;visibility:visible}100%{opacity:0;visibility:hidden}}
        .app-container{width:100%;max-width:500px;background:rgba(12,2,4,.98);border:2.5px solid #ef4444;border-radius:24px;box-shadow:0 0 35px rgba(239,68,68,.4);overflow:hidden;display:flex;flex-direction:column;padding:25px;position:relative;animation:scaleIn .5s ease 5s backwards}
        @keyframes scaleIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
        .top-bar{display:flex;align-items:center;margin-bottom:20px}
        .back-btn{background:rgba(239,68,68,.15);border:1.5px solid #ef4444;color:#ef4444;padding:8px 14px;border-radius:12px;font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .2s;text-decoration:none;box-shadow:0 0 10px rgba(239,68,68,.2)}
        .back-btn:hover{background:#ef4444;color:#fff;box-shadow:0 0 15px rgba(239,68,68,.8)}
        .pair-header{text-align:center;margin-bottom:25px}
        .pair-header h1{font-family:'Orbitron',sans-serif;font-size:26px;font-weight:850;color:#ff2a2a;text-shadow:0 0 15px rgba(255,42,42,.8);letter-spacing:2px;margin-bottom:8px}
        .pair-header p{font-size:14px;color:rgba(255,255,255,.75)}
        .input-group{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
        .input-group label{font-family:'Orbitron',sans-serif;font-size:13px;color:#fff;letter-spacing:1px}
        .input-group input{background:rgba(0,0,0,.6);border:1.5px solid #ef4444;border-radius:14px;padding:12px 16px;color:#fff;font-size:16px;font-family:'Rajdhani',sans-serif;outline:none;box-shadow:inset 0 0 10px rgba(239,68,68,.2);transition:all .3s}
        .input-group input:focus{border-color:#fff;box-shadow:0 0 15px rgba(239,68,68,.8),inset 0 0 10px rgba(239,68,68,.4)}
        .submit-btn{background:linear-gradient(135deg,#dc2626,#991b1b);color:#fff;border:1.5px solid #ff4d4d;border-radius:14px;padding:14px;font-family:'Orbitron',sans-serif;font-size:15px;font-weight:850;cursor:pointer;box-shadow:0 0 20px rgba(220,38,38,.6);transition:all .3s;margin-bottom:20px;letter-spacing:1px;width:100%}
        .submit-btn:hover{background:linear-gradient(135deg,#ef4444,#dc2626);box-shadow:0 0 30px rgba(239,68,68,.9);transform:translateY(-2px)}
        .submit-btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
        .code-box-container{display:none;flex-direction:column;gap:10px;background:rgba(20,5,8,.9);border:2px solid #ff2a2a;border-radius:16px;padding:18px;box-shadow:0 0 25px rgba(255,42,42,.4);animation:popUp .4s cubic-bezier(.175,.885,.32,1.275)}
        @keyframes popUp{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
        .code-box-title{font-family:'Orbitron',sans-serif;font-size:14px;color:#ff6b6b;text-align:center}
        .code-display-area{display:flex;align-items:center;justify-content:space-between;background:#000;border:1.5px dashed #ef4444;border-radius:12px;padding:10px 15px;gap:10px}
        .pairing-code-text{font-family:'Orbitron',sans-serif;font-size:22px;font-weight:850;color:#00f0ff;letter-spacing:2px;text-shadow:0 0 10px rgba(0,240,255,.6);word-break:break-all}
        .copy-btn{background:#ef4444;color:#fff;border:none;border-radius:10px;padding:8px 14px;font-family:'Orbitron',sans-serif;font-weight:700;font-size:12px;cursor:pointer;box-shadow:0 0 10px rgba(239,68,68,.8);transition:.2s;display:flex;align-items:center;gap:6px;white-space:nowrap}
        .copy-btn:hover{background:#ff4d4d;transform:scale(1.05)}
        #toast-msg{display:none;position:fixed;bottom:30px;background:#110204;border:1.5px solid #22c55e;color:#22c55e;padding:10px 20px;border-radius:12px;font-family:'Orbitron',sans-serif;font-size:13px;box-shadow:0 0 15px rgba(34,197,94,.4);z-index:10000}
        #error-msg{display:none;color:#ff6b6b;text-align:center;font-size:13px;margin-top:-8px;margin-bottom:12px}
        @media(max-width:430px){.app-container{padding:20px}.pair-header h1{font-size:23px}.code-display-area{align-items:stretch;flex-direction:column}.copy-btn{justify-content:center}.pairing-code-text{text-align:center;font-size:19px}}
    </style>
</head>
<body>
    <div id="loader-screen"><div class="loader-spinner"></div><div class="loader-text">ZANTA-XMD PAIRING...</div></div>
    <div id="toast-msg">Code Copied Successfully!</div>
    <div class="app-container">
        <div class="top-bar"><button class="back-btn" onclick="goBack()"><i class="fa-solid fa-arrow-left"></i> BACK</button></div>
        <div class="pair-header"><h1>BOT PAIRING</h1><p>Connect your WhatsApp Bot securely with ZANTA-XMD</p></div>
        <div class="input-group"><label for="phone-number">ENTER YOUR PHONE NUMBER</label><input type="text" id="phone-number" inputmode="tel" autocomplete="tel" placeholder="e.g. 94760879639" /></div>
        <div id="error-msg"></div>
        <button class="submit-btn" id="pair-submit" onclick="generatePairCode()">GET PAIR CODE</button>
        <div class="code-box-container" id="code-container"><div class="code-box-title">YOUR SECURE PAIR CODE</div><div class="code-display-area"><span class="pairing-code-text" id="pair-code-val">—</span><button class="copy-btn" onclick="copyCode()"><i class="fa-solid fa-copy"></i> COPY</button></div></div>
    </div>
<script>
function goBack(){history.length>1?history.back():location.href='/'}
function showError(msg){const e=document.getElementById('error-msg');e.textContent=msg;e.style.display='block'}
async function generatePairCode(){
  const input=document.getElementById('phone-number');
  let phoneInput=input.value.trim();
  if(!phoneInput){showError('Please enter your phone number first!');input.focus();return}
  const btn=document.getElementById('pair-submit');
  const err=document.getElementById('error-msg');
  err.style.display='none';
  btn.disabled=true;btn.textContent='GETTING PAIR CODE...';
  try{
    const res=await fetch('/api/pair',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({number:phoneInput})});
    const raw=await res.text();let data={};try{data=raw?JSON.parse(raw):{}}catch{}
    if(!res.ok)throw new Error(data.error||'Pairing failed. Please try again.');
    if(!data.code)throw new Error('Pair code was not returned by the pairing service.');
    document.getElementById('pair-code-val').textContent=data.code;
    document.getElementById('code-container').style.display='flex';
  }catch(e){showError(e.message||'Pairing failed. Please try again.');document.getElementById('code-container').style.display='none'}
  finally{btn.disabled=false;btn.textContent='GET PAIR CODE'}
}
async function copyCode(){const code=document.getElementById('pair-code-val').textContent;if(!code||code==='—')return;try{await navigator.clipboard.writeText(code)}catch{const ta=document.createElement('textarea');ta.value=code;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}const toast=document.getElementById('toast-msg');toast.style.display='block';setTimeout(()=>toast.style.display='none',2000)}
document.getElementById('phone-number').addEventListener('keydown',e=>{if(e.key==='Enter')generatePairCode()});
</script>
</body>
</html>
