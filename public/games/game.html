<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ZANTA Games</title>
<style>
:root{--bg:#02050b;--panel:#0b1324;--blue:#2d8cff;--white:#fff;--muted:#7f94b1}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#02050b;color:#fff;font-family:Inter,system-ui,-apple-system,sans-serif}body{display:flex;justify-content:center;overflow-x:hidden}.phone{width:100%;max-width:430px;min-height:100dvh;padding:0 12px 24px;background:radial-gradient(circle at 85% 8%,#07316b55,transparent 30%),radial-gradient(circle at 10% 70%,#17285b33,transparent 35%),#02050b}.head{height:64px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;background:#02050bf2;backdrop-filter:blur(16px);border-bottom:1px solid #18304d}.back{width:42px;height:42px;border-radius:13px;background:#0c1729;color:#fff;border:1px solid #315d89;font-size:29px;line-height:1}.head b{display:block;font-size:15px}.head small{display:block;color:#6e88a8;font-size:8px;letter-spacing:1.4px;margin-top:3px}.card{position:relative;border:1px solid transparent;border-radius:24px;background:linear-gradient(145deg,#0c172b,#070d19) padding-box,linear-gradient(135deg,#fff,#2d8cff,#fff) border-box;box-shadow:0 18px 55px #000b;margin-top:16px;padding:18px;overflow:hidden}.card:after{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:2px;background:conic-gradient(from var(--a,0deg),transparent 0 300deg,#fff 310deg,#2d8cff 330deg,#fff 345deg,transparent 360deg);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;animation:spin 3.8s linear infinite;pointer-events:none}@keyframes spin{to{--a:360deg}}h1{font-size:28px;margin:2px 0 7px}.muted{color:var(--muted);line-height:1.55}.stats{display:flex;justify-content:space-between;gap:10px;align-items:center}.stat b{font-size:28px;color:#5fc1ff}.game-area{height:410px;margin-top:14px;border:1px solid #214a72;border-radius:22px;background:radial-gradient(circle at center,#0b2442,#050b15 62%);position:relative;overflow:hidden;touch-action:manipulation}.target{position:absolute;width:64px;height:64px;border-radius:50%;border:2px solid #fff;background:radial-gradient(circle,#fff 0 8%,#54b7ff 12%,#176fff 45%,#101c45 70%);box-shadow:0 0 25px #2d8cff,0 0 50px #2d8cff66;display:none;place-items:center;font-size:22px;cursor:pointer;user-select:none}.start,.claim{width:100%;height:50px;border:0;border-radius:15px;background:linear-gradient(100deg,#0c62ff,#2d8cff,#795cff);color:#fff;font-weight:900;letter-spacing:.5px;box-shadow:0 10px 25px #1678ff44}.claim{background:linear-gradient(100deg,#0b9b59,#22d97d);display:none}.status{text-align:center;margin-top:12px;font-size:12px;color:#9eb5d1}.win{display:none;text-align:center;padding:20px 0}.win strong{display:block;font-size:34px;color:#72caff;text-shadow:0 0 18px #2d8cff}.win span{display:block;color:#9cb0ca;margin:6px 0 14px}
</style>
</head>
<body>
<div class="phone">
<header class="head"><button class="back" onclick="goBack()">‹</button><div><b>🎮 ZANTA GAMES</b><small>PLAY · WIN · +20 FREE COINS</small></div></header>
<section class="card"><h1>Coin Rush</h1><p class="muted">Tap the blue target 10 times before the timer ends. Win the round and get <b style="color:#72caff">20 free coins</b>.</p><div class="stats"><div class="stat"><small class="muted">HITS</small><b id="hits">0 / 10</b></div><div class="stat"><small class="muted">TIME</small><b id="time">15s</b></div></div><div class="game-area" id="arena"><button class="target" id="target" type="button">✦</button></div><button class="start" id="start" type="button" onclick="startGame()">START GAME</button><div class="status" id="status">Your 20-coin reward is added securely after a valid win.</div><div class="win" id="win"><strong>YOU WIN! 🎉</strong><span id="rewardText">Adding 20 coins…</span><button class="claim" id="claim" type="button" onclick="claimReward()">GET +20 COINS</button></div></section>
</div>
<script>
let sessionToken='',hits=0,time=15,timer=null,started=false,won=false;
const $=id=>document.getElementById(id);
function goBack(){if(history.length>1)history.back();else location.href='/'}
async function startGame(){clearInterval(timer);hits=0;time=15;won=false;started=true;$('hits').textContent='0 / 10';$('time').textContent='15s';$('status').textContent='Loading game…';$('win').style.display='none';$('claim').style.display='none';$('start').disabled=true;try{const r=await fetch('/api/games/start',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'}});const d=await r.json();if(!r.ok)throw Error(d.error||'Please log in first.');sessionToken=d.token;$('status').textContent='Tap the target 10 times!';placeTarget();$('target').style.display='grid';timer=setInterval(()=>{time--;$('time').textContent=time+'s';if(time<=0){clearInterval(timer);$('target').style.display='none';$('start').disabled=false;started=false;$('status').textContent=hits>=10?'Round complete.':'Time up — try again.'}},1000)}catch(e){$('start').disabled=false;$('status').textContent=e.message}}
function placeTarget(){const a=$('arena'),t=$('target');const pad=10,maxX=Math.max(0,a.clientWidth-t.offsetWidth-pad),maxY=Math.max(0,a.clientHeight-t.offsetHeight-pad);t.style.left=(pad+Math.random()*maxX)+'px';t.style.top=(pad+Math.random()*maxY)+'px'}
$('target').addEventListener('click',()=>{if(!started||won)return;hits++;$('hits').textContent=hits+' / 10';if(hits>=10){won=true;clearInterval(timer);$('target').style.display='none';$('status').textContent='Great! Validating your win…';$('start').disabled=false;$('win').style.display='block';claimReward()}else placeTarget()});
async function claimReward(){if(!sessionToken||!won)return;const btn=$('claim');btn.disabled=true;try{const r=await fetch('/api/games/claim',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:sessionToken})});const d=await r.json();if(!r.ok)throw Error(d.error||'Reward failed.');$('rewardText').textContent='20 free coins added. New balance: '+d.user.coins;$('status').textContent='Game reward added successfully.';sessionToken='';}catch(e){$('rewardText').textContent=e.message;btn.style.display='block';btn.disabled=false}}
window.addEventListener('resize',()=>{if(started&&!won)placeTarget()});
</script>
</body></html>
