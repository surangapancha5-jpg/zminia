<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ZANTA GAMES • VIP CHECKERS</title>
<style>
:root{--bg:#03050a;--panel:#090e1a;--blue:#00d2ff;--white:#fff;--gold:#ffd700;--red:#ff3d78}
*{box-sizing:border-box;margin:0;padding:0;font-family:Segoe UI,Roboto,Arial,sans-serif}html,body{width:100%;min-height:100%;background:#03050a;color:#fff}body{display:flex;justify-content:center;overflow-x:hidden}.app{width:100%;max-width:430px;min-height:100dvh;background:radial-gradient(circle at 50% -10%,#10345a55,transparent 38%),#03050a;padding-bottom:28px}.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 12px;background:#080d16f5;border-bottom:1px solid #174466;box-shadow:0 4px 25px #00d2ff22}.back{width:42px;height:42px;border:1px solid #27506f;border-radius:14px;background:#0b1524;color:#fff;font-size:22px}.brand{font-size:18px;font-weight:900;letter-spacing:1.8px;color:#dff7ff;text-shadow:0 0 12px #00d2ff66;flex:1}.score{display:flex;gap:8px;font-size:10px;font-weight:900}.score span{padding:7px 9px;border-radius:20px;background:#050a12;border:1px solid #263d57}.gold{color:var(--gold)}.turn{color:var(--blue)}.wrap{display:flex;flex-direction:column;align-items:center;padding:18px 12px;gap:15px}.status{width:100%;padding:10px 13px;border:1px solid #1f4966;border-radius:14px;background:#08111e;color:#9bc8df;font-size:11px;text-align:center}.board-frame{width:min(94vw,404px);height:min(94vw,404px);padding:4px;border-radius:18px;background:linear-gradient(135deg,#fff,#168bff,#fff,#168bff,#fff);background-size:300% 300%;animation:border 4s linear infinite;box-shadow:0 0 35px #168bff55}.board{width:100%;height:100%;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border-radius:14px;overflow:hidden;background:#050505}@keyframes border{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}.cell{display:grid;place-items:center;position:relative}.light{background:#fff}.dark{background:#050505}.selected{background:#008dcc!important;box-shadow:inset 0 0 20px #00d2ff}.valid:after{content:'';width:26%;height:26%;border-radius:50%;background:#00d2ff;box-shadow:0 0 14px #00d2ff}.piece{width:78%;height:78%;border-radius:50%;display:grid;place-items:center;cursor:pointer;transition:.12s;position:relative}.piece:hover{transform:scale(1.06)}.piece.gold{background:radial-gradient(circle at 32% 28%,#fff8bf,#d4af37 58%,#805b14);border:3px solid #fff;box-shadow:0 0 16px #ffd700aa,inset 0 0 10px #fff}.piece.white{background:radial-gradient(circle at 32% 28%,#fff,#d9e1eb 58%,#64748b);border:3px solid #334155;box-shadow:0 0 16px #fff9,inset 0 0 10px #fff}.king:after{content:'♛';font-size:clamp(18px,7vw,30px);color:#111;text-shadow:0 1px 2px #fff}.controls{display:flex;gap:9px;width:100%}.btn{flex:1;padding:13px 12px;border:0;border-radius:14px;font-weight:900;background:linear-gradient(135deg,#d4af37,#ffd700);color:#000;box-shadow:0 0 20px #d4af3755}.btn.alt{background:#0b1727;color:#d9f5ff;border:1px solid #294966;box-shadow:none}.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:#000d;opacity:0;pointer-events:none;transition:.2s}.modal.on{opacity:1;pointer-events:auto}.box{width:min(390px,92vw);padding:28px 20px;border-radius:22px;background:#090e1a;border:2px solid #00d2ff;box-shadow:0 0 40px #00d2ff55;text-align:center}.box.win{border-color:#ffd700;box-shadow:0 0 40px #ffd70055}.box.lose{border-color:#ff3d78;box-shadow:0 0 40px #ff3d7855}.box h2{font-size:34px;margin-bottom:10px}.box p{color:#a9b8c9;line-height:1.6;margin-bottom:18px}.reward{display:none;margin-bottom:16px;color:#6be0ff;font-weight:900}.reward.show{display:block}
</style></head><body><div class="app">
<header class="top"><button class="back" onclick="history.back()">‹</button><div class="brand">ZANTA GAMES</div><div class="score"><span class="gold">G <b id="gs">12</b></span><span class="turn" id="turn">GOLD</span><span>W <b id="ws">12</b></span></div></header>
<main class="wrap"><div class="status" id="status">Your turn • Capture the White Bot pieces.</div><div class="board-frame"><div id="board" class="board"></div></div><div class="controls"><button class="btn" onclick="resetGame()">NEW GAME</button><button class="btn alt" onclick="history.back()">BACK</button></div></main></div>
<div class="modal" id="modal"><div class="box" id="box"><h2 id="title">VICTORY!</h2><p id="desc"></p><div class="reward" id="reward">+20 FREE COINS ADDED 🎁</div><button class="btn" onclick="resetGame();closeModal()">PLAY AGAIN</button></div></div>
<script>
const boardEl=document.getElementById('board'),gsEl=document.getElementById('gs'),wsEl=document.getElementById('ws'),turnEl=document.getElementById('turn'),statusEl=document.getElementById('status'),modal=document.getElementById('modal'),box=document.getElementById('box'),titleEl=document.getElementById('title'),descEl=document.getElementById('desc'),rewardEl=document.getElementById('reward');
let b=[],player='gold',selected=null,multi=null,gold=12,white=12,gameToken=null,finished=false;
function inb(r,c){return r>=0&&r<8&&c>=0&&c<8}function dirs(p){return p.king?[[-1,-1],[-1,1],[1,-1],[1,1]]:p.player==='gold'?[[-1,-1],[-1,1]]:[[1,-1],[1,1]]}
function moves(r,c){let p=b[r]?.[c];if(!p)return[];let out=[];for(const[dR,dC]of dirs(p)){let nr=r+dR,nc=c+dC;if(inb(nr,nc)&&!b[nr][nc])out.push({r:nr,c:nc,j:false});let jr=r+dR*2,jc=c+dC*2;if(inb(jr,jc)&&!b[jr][jc]&&b[r+dR][c+dC]&&b[r+dR][c+dC].player!==p.player)out.push({r:jr,c:jc,j:true,mr:r+dR,mc:c+dC})}let jumps=out.filter(x=>x.j);return jumps.length?jumps:out}
function allMoves(p){let a=[];for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(b[r][c]?.player===p)for(const m of moves(r,c))a.push({fr:r,fc:c,m});return a}
function init(){b=Array.from({length:8},()=>Array(8).fill(null));gold=white=12;player='gold';selected=null;multi=null;finished=false;for(let r=0;r<8;r++)for(let c=0;c<8;c++)if((r+c)%2){if(r<3)b[r][c]={player:'white',king:false};else if(r>4)b[r][c]={player:'gold',king:false}};render();statusEl.textContent='Your turn • Capture the White Bot pieces.';startSession()}
function render(){boardEl.innerHTML='';for(let r=0;r<8;r++)for(let c=0;c<8;c++){let cell=document.createElement('div');cell.className='cell '+(((r+c)%2)?'dark':'light');cell.dataset.r=r;cell.dataset.c=c;cell.onclick=()=>click(r,c);let p=b[r][c];if(p){let el=document.createElement('div');el.className='piece '+p.player+(p.king?' king':'');cell.appendChild(el)}boardEl.appendChild(cell)}gsEl.textContent=gold;wsEl.textContent=white;turnEl.textContent=player==='gold'?'GOLD':'BOT'}
function highlight(r,c){render();document.querySelector(`[data-r="${r}"][data-c="${c}"]`)?.classList.add('selected');for(const m of moves(r,c))document.querySelector(`[data-r="${m.r}"][data-c="${m.c}"]`)?.classList.add('valid')}
function click(r,c){if(finished||player!=='gold')return;let p=b[r][c];if(multi){let m=moves(multi.r,multi.c).find(x=>x.j&&x.r===r&&x.c===c);if(m)doMove(multi.r,multi.c,m);return}if(p?.player==='gold'){selected={r,c};highlight(r,c);return}if(selected&&!p){let m=moves(selected.r,selected.c).find(x=>x.r===r&&x.c===c);if(m)doMove(selected.r,selected.c,m)}}
function doMove(fr,fc,m){let p=b[fr][fc];b[m.r][m.c]=p;b[fr][fc]=null;if(m.j){b[m.mr][m.mc]=null;if(p.player==='gold')gold--;else white--}if((p.player==='gold'&&m.r===0)||(p.player==='white'&&m.r===7))p.king=true;render();if(white<=0)return finish(true,'You captured every White Bot piece!');if(gold<=0)return finish(false,'All Gold pieces were lost.');let more=m.j?moves(m.r,m.c).filter(x=>x.j):[];if(more.length){multi={r:m.r,c:m.c};selected=null;if(player==='gold')highlight(m.r,m.c);return}multi=null;selected=null;player=player==='gold'?'white':'gold';render();let avail=allMoves(player);if(!avail.length)return finish(player==='white','No legal moves remain.');if(player==='white'){statusEl.textContent='Bot is thinking…';setTimeout(bot,450)}else statusEl.textContent='Your turn • Make your move.'}
function bot(){if(finished)return;let a=allMoves('white'),j=a.filter(x=>x.m.j);let pick=(j.length?j:a)[Math.floor(Math.random()*(j.length?j:a).length)];doMove(pick.fr,pick.fc,pick.m)}
async function startSession(){try{let r=await fetch('/api/games/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({game:'checkers'})});let d=await r.json();if(r.ok)gameToken=d.token;else statusEl.textContent=d.error||'Please log in to play.'}catch(e){statusEl.textContent='Game reward service unavailable.'}}
async function claimReward(){if(!gameToken)return false;try{let r=await fetch('/api/games/claim',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:gameToken,game:'checkers'})});let d=await r.json();if(r.ok&&d.success){rewardEl.classList.add('show');return true}descEl.textContent=(d.error||'Game won, but reward could not be claimed.');return false}catch(e){descEl.textContent='Game won, but the reward service is unavailable.';return false}}
async function finish(win,msg){if(finished)return;finished=true;titleEl.textContent=win?'VICTORY!':'MISSION FAILED!';descEl.textContent=msg;box.className='box '+(win?'win':'lose');rewardEl.classList.remove('show');modal.classList.add('on');if(win)await claimReward()}
function closeModal(){modal.classList.remove('on')}function resetGame(){closeModal();init()}
init();
</script></body></html>
