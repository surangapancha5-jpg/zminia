<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#030712">
    <title>ZANTA-XMD OFC · VIP System Loading</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f3ff;
            --secondary: #9d00ff;
            --accent: #ff0077;
            --bg-dark: #030712;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-dark);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Cyberpunk Background Grid */
        .bg-grid {
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(to right, rgba(0, 243, 255, 0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 243, 255, 0.04) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: rotateX(60deg) translateY(-100px);
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: rotateX(60deg) translateY(0); }
            100% { transform: rotateX(60deg) translateY(50px); }
        }

        /* Glow Orbs */
        .orb {
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.4;
            animation: orbFloat 6s ease-in-out infinite alternate;
        }

        .orb-1 { background: var(--primary); top: 15%; left: 20%; }
        .orb-2 { background: var(--secondary); bottom: 15%; right: 20%; animation-delay: -3s; }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, -30px) scale(1.1); }
        }

        /* VIP Card Container */
        .card {
            position: relative;
            z-index: 10;
            background: rgba(10, 16, 32, 0.55);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 243, 255, 0.15);
            border-radius: 28px;
            padding: 45px 40px;
            text-align: center;
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.8),
                inset 0 0 20px rgba(0, 243, 255, 0.05);
            width: 360px;
        }

        /* Animated Logo Core */
        .logo-wrapper {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ring {
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: var(--primary);
            border-right-color: var(--secondary);
            animation: spinRing 2s linear infinite;
        }

        .ring-outer {
            inset: -18px;
            border: 1px dashed rgba(255, 0, 119, 0.5);
            animation: spinRingReverse 4s linear infinite;
        }

        @keyframes spinRing {
            100% { transform: rotate(360deg); }
        }

        @keyframes spinRingReverse {
            100% { transform: rotate(-360deg); }
        }

        .logo {
            width: 100%;
            height: 100%;
            border-radius: 24px;
            background: linear-gradient(135deg, var(--primary), var(--secondary), var(--accent));
            display: grid;
            place-items: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 48px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 35px rgba(0, 243, 255, 0.5);
            animation: pulseLogo 2s ease-in-out infinite alternate;
        }

        @keyframes pulseLogo {
            0% { transform: scale(0.98); filter: drop-shadow(0 0 10px var(--primary)); }
            100% { transform: scale(1.05); filter: drop-shadow(0 0 25px var(--accent)); }
        }

        /* Title Styling */
        .title {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 4px;
            color: #ffffff;
            margin-bottom: 6px;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        .subtitle {
            font-size: 11px;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        /* Progress Bar */
        .progress-box {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            height: 6px;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
            border-radius: 10px;
            box-shadow: 0 0 15px var(--primary);
            animation: fillProgress 3s ease-in-out infinite;
        }

        @keyframes fillProgress {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }

        /* Status Text */
        .status {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            font-size: 11px;
            letter-spacing: 2px;
            color: var(--primary);
            font-weight: 600;
        }

        .vip-badge {
            display: inline-block;
            margin-top: 25px;
            padding: 5px 14px;
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid var(--primary);
            border-radius: 20px;
            font-size: 10px;
            letter-spacing: 2px;
            color: var(--primary);
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }
    </style>
</head>
<body>

    <div class="bg-grid"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <main class="card">
        <div class="logo-wrapper">
            <div class="ring-outer"></div>
            <div class="ring"></div>
            <div class="logo">Z</div>
        </div>

        <div class="title">ZANTA-XMD</div>
        <div class="subtitle">Official System</div>

        <div class="progress-box">
            <div class="progress-bar"></div>
        </div>

        <div class="status">
            <span>INITIALIZING...</span>
            <span>SECURE</span>
        </div>

        <div class="vip-badge">✦ VIP ACCESS ✦</div>
    </main>

</body>
</html>
